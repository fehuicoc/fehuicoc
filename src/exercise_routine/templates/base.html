<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }} · Exercise Routine Coach{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/coach.css">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <p class="brand">Exercise <span>Routine Coach</span></p>
    <nav class="app-nav" aria-label="Coach sections">
      <a href="/import" {% if page == 'import' %}aria-current="page"{% endif %}>Import</a>
      <a href="/library" {% if page == 'library' %}aria-current="page"{% endif %}>My routines</a>
      <a href="/author" {% if page == 'author' %}aria-current="page"{% endif %}>Build</a>
      <a href="/session" {% if page == 'session' %}aria-current="page"{% endif %}>Session</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">
    <p>Personal practice coach · English guidance · Not medical advice</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
